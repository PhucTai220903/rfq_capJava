spring:
  config.activate.on-profile: default
  sql.init.platform: h2
  web.resources.static-locations: file:./app/
cds:
  data-source.auto-config.enabled: false
  security:
    mock:
      default-users:
        enabled: false
      users:
        admin:
          name: admin
          password: admin
          roles: ADMIN
        vendor:
          name: vendor
          password: vendor
          roles: VENDOR
        buyer:
          name: buyer
          password: buyer
          roles: BUYER
management:
  endpoint:
    health:
      show-components: always
      probes.enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    defaults.enabled: false
    ping.enabled: true
    db.enabled: true
